name: Workflow Action Lint

# Lints .github/workflows/ with rhysd/actionlint (expression/context errors, shellcheck on run:
# blocks, action input validation). actionlint is pinned via the tool directive in go.mod so the
# gomod dependabot config keeps it up to date; its config lives in .github/actionlint.yaml.

permissions:
  contents: read

on:
  push:
    branches: [ 'main' ]
  pull_request:
    types: ['opened', 'synchronize']
    paths:
      - '.github/workflows/**'
      - '.github/actionlint*'
      - 'go.mod'
      - 'makefile'

concurrency:
  group: 'workflow-actionlint-${{ github.head_ref || github.ref }}'
  cancel-in-progress: true

jobs:
  workflow-actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: ./.go-version
      # the problem matcher turns actionlint's file:line:col output into inline PR annotations
      - name: Register actionlint problem matcher
        run: echo "::add-matcher::.github/actionlint-matcher.json"
      # the make target passes -config-file (non-default config path) and -shellcheck=shellcheck,
      # which names the executable (preinstalled on ubuntu-latest) rather than disabling it
      - name: Run actionlint (with shellcheck) on workflow files
        run: make actionlint
