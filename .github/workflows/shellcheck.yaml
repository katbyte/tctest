name: ShellCheck
on:
  push:
    branches: [ 'main' ]
  pull_request:
    types: ['opened', 'synchronize']
    paths:
      - '**.sh'
      - 'makefile'
      - '.github/workflows/shellcheck.yaml'

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # shellcheck is preinstalled on ubuntu-latest
      - run: make shellcheck
