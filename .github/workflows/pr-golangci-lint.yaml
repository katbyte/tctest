---
name: GolangCI Lint
on:
  push:
    branches: [ 'main' ]
  pull_request:
    types: ['opened', 'synchronize']
    paths:
      - '.github/**'
      - '**.go'
      - 'vendor/**'
      - '.tools/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: ./.go-version
      # build the version pinned in .tools/go.mod so CI and make use the same binary, then hand
      # it to the action (install-mode: none) which still provides caching and inline annotations
      - name: Build golangci-lint from .tools/go.mod
        run: |
          make .tools/bin/golangci-lint
          echo "$PWD/.tools/bin" >> "$GITHUB_PATH"
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          install-mode: none
          args: -v
